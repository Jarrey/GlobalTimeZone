<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c32" width="32" height="32"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c128" width="128" height="128"></canvas>
<div id="links"></div>
<script src="icon_drawing.js"></script>
<script>
const links = document.getElementById('links');

ICON_SIZES.forEach(size => {
  const canvas = document.getElementById('c' + size);
  const ctx = canvas.getContext('2d');
  drawIcon(ctx, size); // Uses default 10:10 from shared module
  const a = document.createElement('a');
  a.download = 'icon' + size + '.png';
  a.href = canvas.toDataURL('image/png');
  a.textContent = 'Download icon' + size + '.png';
  a.style.display = 'block';
  a.style.margin = '8px';
  links.appendChild(a);
});
</script>
</body>
</html>
