<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Global Time Zone — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f14;
      color: #e4e4f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      padding: 0;
    }

    .page-wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: #cdd6f4;
    }

    .page-subtitle {
      font-size: 13px;
      color: #6c7086;
      margin-top: 4px;
    }

    .section {
      background: #181825;
      border: 1px solid #1e1e2e;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #a6adc8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 16px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .setting-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #cdd6f4;
      font-size: 13px;
      cursor: pointer;
    }

    .setting-row input[type="radio"] {
      accent-color: #89b4fa;
    }

    .setting-info {
      font-size: 12px;
      color: #6c7086;
      line-height: 1.6;
    }

    /* Timezone list */
    .tz-list { display: flex; flex-direction: column; gap: 8px; }

    .tz-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1e1e2e;
      border-radius: 8px;
      padding: 10px 12px;
      transition: background 0.12s;
    }

    .tz-row:hover { background: #232336; }

    .drag-handle {
      cursor: grab;
      color: #45475a;
      padding: 2px 4px;
      flex-shrink: 0;
    }

    .drag-handle:active { cursor: grabbing; }
    .drag-handle svg { width: 14px; height: 14px; fill: currentColor; display: block; }

    .tz-row-content { flex: 1; min-width: 0; display: flex; gap: 10px; align-items: center; }

    .tz-label-input, .tz-zone-select {
      background: #0f0f14;
      border: 1px solid #313244;
      border-radius: 6px;
      color: #cdd6f4;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    .tz-label-input:focus, .tz-zone-select:focus { border-color: #89b4fa; }

    .tz-label-input { width: 130px; flex-shrink: 0; }
    .tz-zone-select { flex: 1; min-width: 0; }

    .tz-badge-primary {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #313244;
      color: #6c7086;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .tz-badge-primary.active {
      background: #1e3a5f;
      color: #89b4fa;
      border-color: #89b4fa44;
    }

    .tz-badge-primary:hover { border-color: #585b70; color: #cdd6f4; }

    .del-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #45475a;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background 0.12s, color 0.12s;
      flex-shrink: 0;
      display: flex;
    }

    .del-btn:hover { background: #3b1a1a; color: #f38ba8; }
    .del-btn svg { width: 15px; height: 15px; fill: currentColor; }

    .add-tz-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      background: #1e1e2e;
      border: 1px dashed #313244;
      border-radius: 8px;
      color: #6c7086;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 10px;
    }

    .add-tz-btn:hover { background: #181825; border-color: #585b70; color: #cdd6f4; }
    .add-tz-btn svg { width: 15px; height: 15px; fill: currentColor; }

    /* Primary timezone display section */
    .primary-desc {
      font-size: 12px;
      color: #6c7086;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    /* Save bar */
    .save-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #181825;
      border-top: 1px solid #1e1e2e;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .save-msg {
      font-size: 12px;
      color: #a6e3a1;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .save-msg.show { opacity: 1; }

    .save-btn {
      background: #89b4fa;
      color: #1e1e2e;
      border: none;
      border-radius: 8px;
      padding: 9px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .save-btn:hover { background: #b4d0fa; }
    .save-btn:active { transform: scale(0.97); }

    /* Sortable ghost */
    .tz-row.sortable-ghost { opacity: 0.4; }
    .tz-row.sortable-chosen { box-shadow: 0 0 0 2px #89b4fa44; }

    .help-text {
      font-size: 12px;
      color: #585b70;
      margin-top: 8px;
      line-height: 1.6;
    }

    option { background: #1e1e2e; }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="page-header">
      <div>
        <div class="page-title">🌐 Global Time Zone Settings</div>
        <div class="page-subtitle">Configure the time zones shown in the popup.</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Time format</div>
      <div class="setting-row">
        <label><input type="radio" name="timeFormat" value="24h" checked /> 24-hour</label>
        <label><input type="radio" name="timeFormat" value="12h" /> 12-hour</label>
      </div>
      <p class="setting-info">Choose how times are displayed across the popup and toolbar icon.</p>
    </div>

    <div class="section">
      <div class="section-title">Timezone list</div>
      <div class="tz-list" id="tzList"></div>
      <button class="add-tz-btn" id="addTzBtn">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Add timezone
      </button>
      <p class="help-text">Drag the left handle to reorder. Click "Primary" to set a timezone for the toolbar icon.</p>
    </div>

    <div style="height: 60px;"></div>
  </div>

  <div class="save-bar">
    <span class="save-msg" id="saveMsg">✓ Saved</span>
    <button class="save-btn" id="saveBtn">Save settings</button>

  <script src="timezones.js"></script>
  <script src="options.js"></script>
</body>
</html>
